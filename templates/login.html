{% extends "base.html" %}
{% block title %}Sign in - Smart AgriWeather{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card card-futuristic"><div class="card-body p-4">
    <h4 class="mb-1"><i class="fas fa-right-to-bracket me-2"></i>Sign in</h4>
    <p class="text-muted small mb-4">Sign in to save your activity and personal alerts.</p>
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="username"></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    {% if allow_signup %}<p class="small text-center mt-3 mb-0">No account? <a href="{{ url_for('auth.signup') }}">Create one</a></p>{% endif %}
  </div></div>
</div></div>
{% endblock %}
