<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin sign in · Smart Weather</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
</head>
<body class="admin"><div class="login-wrap"><div class="a-card login-card">
  <div class="text-center mb-4">
    <span class="admin-brand justify-content-center" style="color:var(--text)"><span class="logo text-white"><i class="fa-solid fa-cloud-sun-rain"></i></span>
    <span class="text-start"><strong>Smart Weather</strong><small>ADMIN</small></span></span>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}
    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} py-2 small" role="alert">{{ message }}</div>
  {% endfor %}{% endwith %}
  <form method="post" action="{{ url_for('admin.login') }}" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <div class="mb-3"><label class="form-label small fw-semibold" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="username"></div>
    <div class="mb-3"><label class="form-label small fw-semibold" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary w-100" type="submit"><i class="fa-solid fa-lock me-1"></i>Sign in to admin</button>
  </form>
  <p class="text-center small text-muted mt-3 mb-0"><a href="{{ url_for('dashboard') }}" class="text-decoration-none">← Back to Smart Weather</a></p>
</div></div></body></html>
