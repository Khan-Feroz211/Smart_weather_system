{% extends "base.html" %}
{% block title %}Register Farm – Smart AgriWeather{% endblock %}

{% block content %}
<div class="container" style="max-width:600px;">

  <div class="row mb-4">
    <div class="col">
      <h1 class="display-6 fw-bold text-glow mb-1">
        <i class="fas fa-tractor me-2 text-success"></i>Register New Farm
      </h1>
      <p class="text-muted mb-0">Enter farm profile details below</p>
    </div>
  </div>

  <div class="card-futuristic">
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('add_farm') }}">

        <div class="mb-3">
          <label class="form-label fw-bold">Farm Name</label>
          <input type="text" name="name" class="form-control glass-effect" required
                 placeholder="e.g. Green Valley Farm">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Owner Name</label>
          <input type="text" name="owner_name" class="form-control glass-effect" required
                 placeholder="Full name of farm owner">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Location / City</label>
          <input type="text" name="location" class="form-control glass-effect" required
                 placeholder="e.g. Lahore, Karachi, Multan">
          <div class="form-text text-muted">Used to fetch local weather data for all fields.</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Total Farm Area (hectares)</label>
          <input type="number" step="0.1" name="total_area_ha" class="form-control glass-effect"
                 placeholder="0.0" min="0">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success btn-futuristic flex-grow-1">
            <i class="fas fa-check me-1"></i> Register Farm
          </button>
          <a href="{{ url_for('farms_list') }}" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
